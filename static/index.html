<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#212529">
  <meta name="description" content="Read-only disk usage for your server.">
  <title>Orbit</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/bootstrap.min.css">
  <link rel="stylesheet" href="/orbit.css">
  <script src="/app.js" defer></script>
</head>
<body class="bg-body">
  <svg class="symbols position-absolute" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <symbol id="i-disk" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="M3 14h18M7 17h.01M11 17h.01"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M6.1 6.1A8 8 0 0 1 20 12M4 12a8 8 0 0 0 13.9 5.9"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M19 12H5m7-7-7 7 7 7"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3Z"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l5 5v13H6ZM14 3v6h5"/></symbol>
    </defs>
  </svg>

  <header class="navbar bg-body-tertiary border-bottom">
    <div class="container-xl py-1">
      <a class="navbar-brand d-flex align-items-center gap-2 mb-0" href="/" aria-label="Orbit home">
        <svg class="icon" aria-hidden="true"><use href="#i-disk"/></svg>
        <span>Orbit</span>
      </a>
    </div>
  </header>

  <main class="container-xl py-4">
    <section class="row g-2 align-items-end mb-4" aria-label="Volume controls">
      <div class="col">
        <label class="form-label small text-body-secondary" for="volume-select">File system or disk</label>
        <select class="form-select" id="volume-select"><option>Loading…</option></select>
      </div>
      <div class="col-auto">
        <button class="btn btn-primary d-flex align-items-center gap-2 scan-button" id="scan-button" disabled>
          <svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg><span>Scan</span>
        </button>
      </div>
    </section>

    <div class="alert alert-danger mb-4" id="connection-error" role="alert" hidden></div>

    <section class="row g-3 align-items-end mb-4" aria-label="Volume capacity">
      <div class="col-md">
        <h1 class="h3 mb-1" id="volume-title">Loading…</h1>
        <p class="small text-body-secondary mb-0"><span id="volume-path">—</span><span class="mx-2">·</span><span id="scan-time">—</span></p>
      </div>
      <div class="col-md-auto text-md-end">
        <strong class="fs-4 fw-semibold d-block" id="used-summary">—</strong>
        <span class="small text-body-secondary" id="free-summary">—</span>
      </div>
      <div class="col-12">
        <div class="progress" role="progressbar" aria-label="Used capacity" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress-bar" id="used-meter" style="width:0%"></div>
        </div>
      </div>
    </section>

    <div class="alert alert-info d-flex align-items-center gap-2 py-2 mb-4" id="scan-progress" role="status" hidden>
      <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
      <span id="progress-detail">Scanning…</span>
      <button class="btn btn-sm btn-outline-info ms-auto" id="cancel-button">Cancel</button>
    </div>
    <div class="alert alert-warning mb-4" id="scan-warning" role="alert" hidden></div>

    <section class="card overflow-hidden">
      <nav class="card-header d-flex align-items-center gap-1 overflow-x-auto flex-nowrap py-2 breadcrumb-scroll" id="breadcrumbs" aria-label="Folder path"></nav>
      <div class="row g-0">
        <div class="col-lg-7 map explorer-map position-relative d-flex align-items-center justify-content-center p-3 border-end">
          <svg class="sunburst" id="sunburst" viewBox="0 0 640 640" role="group" aria-label="Disk usage map"></svg>
          <button class="chart-center position-absolute top-50 start-50 translate-middle rounded-circle border-0 bg-transparent d-flex flex-column align-items-center justify-content-center p-2" id="chart-center" disabled>
            <strong class="fs-4 fw-semibold" id="center-value">—</strong>
            <span class="small text-body-secondary text-truncate mw-100" id="center-name">Waiting for scan</span>
          </button>
          <div class="chart-placeholder position-absolute top-0 start-0 w-100 h-100 d-flex flex-column align-items-center justify-content-center gap-2 bg-body-tertiary text-body-secondary" id="chart-placeholder">
            <strong class="text-body fw-medium">Waiting for scan</strong>
            <span>Capacity is available above.</span>
          </div>
        </div>

        <div class="col-lg-5 d-flex flex-column p-4 list-panel">
          <div class="d-flex align-items-center justify-content-between border-bottom pb-3">
            <div class="min-width-0">
              <strong class="d-block text-truncate" id="directory-title">Contents</strong>
              <span class="small text-body-secondary" id="directory-count"></span>
            </div>
            <button class="btn btn-sm btn-outline-secondary ms-3" id="up-button" aria-label="Go to parent folder" disabled><svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg></button>
          </div>
          <div class="list-group list-group-flush directory-list" id="directory-list"></div>
          <div class="d-flex align-items-center justify-content-between gap-2 pt-3" id="pagination" hidden>
            <button class="btn btn-sm btn-outline-secondary" id="previous-page">Previous</button>
            <span class="small text-body-secondary" id="page-count"></span>
            <button class="btn btn-sm btn-outline-secondary" id="next-page">Next</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="alert alert-success position-fixed bottom-0 start-50 translate-middle-x mb-3 shadow z-3" id="toast" role="status" hidden></div>
</body>
</html>

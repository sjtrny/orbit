name: orbit

services:
  orbit:
    build:
      context: .
    image: orbit:local
    container_name: orbit
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    stop_grace_period: 20s
    ports:
      - "${ORBIT_LISTEN_ADDRESS:-127.0.0.1}:${ORBIT_PORT:-8080}:8080"
    environment:
      ORBIT_CONFIG: /config/volumes.json
      ORBIT_DATA: /data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    volumes:
      - type: bind
        source: ${ORBIT_CONFIG_FILE:-./volumes.json}
        target: /config/volumes.json
        read_only: true
      - type: bind
        source: /
        target: /host
        read_only: true
        bind:
          propagation: rslave
      - type: volume
        source: orbit-data
        target: /data

volumes:
  orbit-data:
